<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KolonoEX — Admin</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <style>
    /* ── KolonoEX admin console ────────────────────────────────────────
       An operations tool: dense, quiet, and legible at a glance. Money is
       set in tabular figures so columns line up; state is carried by a
       coloured dot rather than shouting colour across a whole row. */
    :root {
      --bg:#0b0d12; --bg-2:#0f1218; --surface:#141822; --surface-2:#191e2a;
      --line:#222836; --line-2:#2b3242;
      --text:#e8edf7; --text-2:#98a2b8; --text-3:#5f6981;
      --green:#4eeaa0; --red:#ff6b6b; --amber:#ffb454; --blue:#63a4ff; --violet:#b07bff; --gold:#f0b90b;
      --r:14px; --r-sm:10px;
      --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    ::selection { background:rgba(78,234,160,.24); }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      background:var(--bg); color:var(--text); max-width:860px; margin:0 auto;
      padding:0 14px 64px; -webkit-tap-highlight-color:transparent;
      background-image:radial-gradient(1100px 420px at 50% -220px, rgba(78,234,160,.06), transparent 70%); }
    input,button,select { font-family:inherit; }
    .num { font-variant-numeric:tabular-nums; }

    /* ── masthead ── */
    .top { position:sticky; top:0; z-index:20; margin:0 -14px 14px; padding:12px 14px 11px;
      background:rgba(11,13,18,.86); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
      border-bottom:0.5px solid var(--line); display:flex; align-items:center; gap:11px; }
    .top .mark { width:32px; height:32px; border-radius:9px; flex-shrink:0; display:grid; place-items:center;
      background:linear-gradient(140deg,#4eeaa0,#1f8f63); color:#04120c; font-size:16px; }
    h1 { font-size:15px; font-weight:700; letter-spacing:-.01em; line-height:1.15; }
    .top .sub { font-size:11px; color:var(--text-3); margin-top:1px; }

    /* ── unlock ── */
    .gate { background:var(--surface); border:0.5px solid var(--line); border-radius:18px;
      padding:26px 22px; margin-top:16vh; box-shadow:0 24px 60px rgba(0,0,0,.5); }
    .gate .glyph { width:46px; height:46px; border-radius:13px; display:grid; place-items:center;
      background:rgba(78,234,160,.1); border:0.5px solid rgba(78,234,160,.28); color:var(--green);
      font-size:22px; margin-bottom:14px; }
    .gate input { width:100%; background:var(--bg-2); border:1px solid var(--line-2); color:var(--text);
      border-radius:var(--r-sm); padding:13px 14px; font-size:14px; outline:none; margin:12px 0;
      transition:border-color .15s ease, box-shadow .15s ease; }
    .gate input:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(78,234,160,.12); }
    .gate .btn { width:100%; }

    /* ── buttons ── */
    .btn { background:var(--green); color:#04120c; border:none; border-radius:var(--r-sm);
      padding:10px 15px; font-size:13.5px; font-weight:650; cursor:pointer; letter-spacing:-.01em;
      display:inline-flex; align-items:center; justify-content:center; gap:6px;
      transition:filter .12s ease, transform .08s ease; }
    .btn:active { transform:translateY(1px); filter:brightness(.94); }
    .btn i { font-size:15px; }
    .btn.sec { background:var(--surface-2); color:var(--text); border:0.5px solid var(--line-2); }
    .btn.red { background:rgba(255,107,107,.13); color:var(--red); border:0.5px solid rgba(255,107,107,.32); }
    .btn.amber { background:rgba(255,180,84,.13); color:var(--amber); border:0.5px solid rgba(255,180,84,.32); }
    .btn.blue { background:rgba(99,164,255,.13); color:var(--blue); border:0.5px solid rgba(99,164,255,.32); }
    .btn.ghost { background:var(--surface-2); color:var(--text-2); border:0.5px solid var(--line-2); }
    .btn.ghost:hover { color:var(--text); border-color:var(--green); }
    .click { cursor:pointer; }
    .btn:disabled { opacity:.4; cursor:default; }

    /* ── tabs: a scrollable rail, so adding one never wraps ── */
    .tabs-wrap { position:relative; margin-bottom:13px; }
    /* The rail runs off the edge of a phone. A fade says "there is more here",
       which a hard crop does not. */
    .tabs-wrap::after { content:''; position:absolute; right:0; top:0; bottom:0; width:26px;
      pointer-events:none; background:linear-gradient(90deg,rgba(11,13,18,0),var(--bg)); }
    .tabs { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none;
      padding:0 22px 2px 0; }
    .tabs::-webkit-scrollbar { display:none; }
    .tab { flex:0 0 auto; padding:8px 14px; border-radius:100px; background:var(--surface);
      border:0.5px solid var(--line); color:var(--text-2); font-size:13px; font-weight:600;
      cursor:pointer; white-space:nowrap; transition:all .15s ease; }
    .tab:active { transform:scale(.97); }
    .tab.on { background:rgba(78,234,160,.12); border-color:rgba(78,234,160,.45); color:var(--green); }

    .bar { display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
    .bar .pill { font-size:12px; color:var(--text-3); font-variant-numeric:tabular-nums; }

    .search { display:flex; align-items:center; gap:9px; background:var(--surface);
      border:0.5px solid var(--line); border-radius:var(--r-sm); padding:10px 13px; margin-bottom:12px;
      transition:border-color .15s ease; }
    .search:focus-within { border-color:var(--line-2); }
    .search i { color:var(--text-3); }
    .search input { flex:1; background:none; border:none; color:var(--text); font-size:14px; outline:none; }

    /* ── cards ── */
    .card { background:linear-gradient(180deg,var(--surface),var(--bg-2));
      border:0.5px solid var(--line); border-radius:var(--r); padding:14px; margin-bottom:10px; }
    .card.click { cursor:pointer; transition:border-color .15s ease, transform .08s ease; }
    .card.click:active { transform:scale(.995); border-color:var(--line-2); }
    .row { display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:4px 0; align-items:baseline; }
    .row .k { color:var(--text-2); flex-shrink:0; }
    .row .val { color:var(--text); word-break:break-all; text-align:right; }
    .amt { font-size:19px; font-weight:750; color:var(--green); font-variant-numeric:tabular-nums;
      letter-spacing:-.02em; }

    .net, .badge { font-size:11px; color:var(--text-2); background:var(--bg-2);
      border:0.5px solid var(--line-2); border-radius:6px; padding:2px 8px; white-space:nowrap; }

    /* state reads from a dot, so the row stays calm */
    .st { font-size:10.5px; font-weight:700; border-radius:100px; padding:3px 9px 3px 7px;
      text-transform:uppercase; letter-spacing:.03em; display:inline-flex; align-items:center; gap:5px; }
    .st::before { content:''; width:5px; height:5px; border-radius:50%; background:currentColor; }
    .st.pending { color:var(--amber); background:rgba(255,180,84,.12); }
    .st.approved { color:var(--blue); background:rgba(99,164,255,.12); }
    .st.paid { color:var(--green); background:rgba(78,234,160,.12); }
    .st.rejected, .st.banned { color:var(--red); background:rgba(255,107,107,.12); }

    .acts { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
    .acts .btn { flex:1; min-width:96px; }
    .copy { cursor:pointer; color:var(--green); margin-left:6px; }
    .empty { text-align:center; color:var(--text-3); padding:52px 0; font-size:14px; }
    .empty i { display:block; font-size:34px; opacity:.35; margin-bottom:10px; }
    .err { color:var(--red); font-size:13px; margin:8px 0; }

    .sec-title { font-size:10.5px; color:var(--text-3); text-transform:uppercase; letter-spacing:.08em;
      font-weight:700; margin:20px 0 8px; display:flex; align-items:center; gap:8px; }
    .sec-title::after { content:''; flex:1; height:1px; background:var(--line); }

    /* ── user header ── */
    .u-head { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
    .u-av { width:46px; height:46px; border-radius:14px; background:linear-gradient(140deg,#4eeaa0,#1f8f63);
      color:#04120c; display:grid; place-items:center; font-size:19px; font-weight:800; flex-shrink:0; }
    .u-name { font-size:16px; font-weight:700; letter-spacing:-.01em; }
    .u-id { font-size:11px; color:var(--text-3); font-family:var(--mono); }

    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .stat { background:var(--bg-2); border:0.5px solid var(--line); border-radius:var(--r-sm); padding:11px 12px; }
    .stat .l { font-size:10.5px; color:var(--text-3); text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
    .stat .v { font-size:17px; font-weight:750; margin-top:3px; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }

    .li { background:var(--bg-2); border:0.5px solid var(--line); border-radius:var(--r-sm);
      padding:10px 12px; margin-bottom:6px; font-size:12px; }
    .li .top { display:flex; justify-content:space-between; gap:8px; }
    .mini { font-size:11px; color:var(--text-3); margin-top:2px; line-height:1.5; }
    .mini code { font-family:var(--mono); background:var(--bg-2); border:0.5px solid var(--line);
      border-radius:4px; padding:0 4px; }

    .adj { display:flex; gap:8px; margin-top:8px; }
    .adj input, .adj select, .adj textarea { flex:1; background:var(--bg-2); border:1px solid var(--line-2); color:var(--text);
      border-radius:9px; padding:10px 11px; font-size:13px; outline:none; min-width:0;
      transition:border-color .15s ease, box-shadow .15s ease; }
    .adj input:focus, .adj select:focus, .adj textarea:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(78,234,160,.1); }
    .adj input::placeholder, .adj textarea::placeholder { color:var(--text-3); }
    .long { color:var(--green); } .short { color:var(--red); }

    /* labeled partner fields */
    .pfield { margin-top:10px; }
    .pfield > label { display:block; font-size:11.5px; color:var(--text); font-weight:650; margin-bottom:3px; }
    .pfield > .hint { font-size:10.5px; color:var(--text-3); margin-bottom:6px; line-height:1.45; }
    .pfield input { width:100%; background:var(--bg-2); border:1px solid var(--line-2); color:var(--text);
      border-radius:9px; padding:10px 12px; font-size:14px; outline:none;
      transition:border-color .15s ease, box-shadow .15s ease; }
    .pfield input:focus { border-color:var(--violet); box-shadow:0 0 0 3px rgba(176,123,255,.12); }
    .pf-grid { display:flex; gap:8px; }
    .pf-grid .pfield { flex:1; }
    .psec { border-top:0.5px solid var(--line); margin-top:14px; padding-top:12px; }
    .psec-t { font-size:10.5px; color:var(--violet); font-weight:700; text-transform:uppercase;
      letter-spacing:.06em; margin-bottom:2px; }

    .back { display:inline-flex; align-items:center; gap:6px; color:var(--text-2); font-size:13.5px;
      cursor:pointer; margin-bottom:12px; padding:6px 11px 6px 8px; border-radius:100px;
      background:var(--surface); border:0.5px solid var(--line); }
    .back:active { background:var(--surface-2); }
</style>
</head>
<body>
  <div class="top">
    <div class="mark"><i class="ti ti-shield-lock"></i></div>
    <div style="flex:1;min-width:0;">
      <h1>KolonoEX Admin</h1>
      <div class="sub" id="topSub">Users, balances, withdrawals</div>
    </div>
    <div id="backBtn" class="back" style="display:none;margin:0;" onclick="goExchange()"><i class="ti ti-arrow-left"></i> Exchange</div>
  </div>

  <div id="gate" class="gate">
    <div class="glyph"><i class="ti ti-lock"></i></div>
    <div style="font-size:15px;font-weight:700;">Admin access</div>
    <div style="font-size:12.5px;color:var(--text-2);margin-top:3px;">Enter the admin secret to continue.</div>
    <input id="secret" type="password" placeholder="ADMIN_SECRET" autocomplete="off" onkeydown="if(event.key==='Enter')login()">
    <button class="btn" onclick="login()"><i class="ti ti-arrow-right"></i> Unlock</button>
    <div id="gate-err" class="err"></div>
  </div>

  <div id="app" style="display:none;">
    <div class="tabs-wrap"><div class="tabs">
      <div class="tab on" id="tab-users" onclick="setTab('users')"><i class="ti ti-users" style="font-size:14px;margin-right:5px;vertical-align:-2px;"></i>Users</div>
      <div class="tab" id="tab-wd" onclick="setTab('wd')"><i class="ti ti-arrow-up-right" style="font-size:14px;margin-right:5px;vertical-align:-2px;"></i>Withdrawals</div>
      <div class="tab" id="tab-dep" onclick="setTab('dep')"><i class="ti ti-arrow-down-left" style="font-size:14px;margin-right:5px;vertical-align:-2px;"></i>Deposits</div>
      <div class="tab" id="tab-sup" onclick="setTab('sup')"><i class="ti ti-message-2" style="font-size:14px;margin-right:5px;vertical-align:-2px;"></i>Support</div>
      <div class="tab" id="tab-tasks" onclick="setTab('tasks')"><i class="ti ti-checklist" style="font-size:14px;margin-right:5px;vertical-align:-2px;"></i>Tasks</div>
      <div class="tab" id="tab-banners" onclick="setTab('banners')"><i class="ti ti-photo" style="font-size:14px;margin-right:5px;vertical-align:-2px;"></i>Banners</div>
      <div class="tab" id="tab-partners" onclick="setTab('partners')"><i class="ti ti-diamond" style="font-size:14px;margin-right:5px;vertical-align:-2px;"></i>Partners</div>
    </div></div>
    <div class="bar">
      <button class="btn sec" onclick="refresh()"><i class="ti ti-refresh"></i> Refresh</button>
      <span class="pill" id="count"></span>
      <label class="online-toggle" style="margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#9aa3b8;cursor:pointer;user-select:none;">
        <input type="checkbox" id="onlineChk" onchange="toggleOnline()" style="width:16px;height:16px;accent-color:#4eeaa0;"> Online for chat
      </label>
      <button class="btn sec" onclick="logout()">Lock</button>
    </div>
    <div id="view"></div>
  </div>

  <script>
    let SECRET = sessionStorage.getItem('kx_admin') || '';
    // Telegram WebApp initData for in-app admin auth: from the WebApp object, or
    // forwarded by the mini app via the URL hash (#init=...) on navigation.
    let INIT = '';
    (function () {
      try { if (window.Telegram && Telegram.WebApp) { Telegram.WebApp.ready(); Telegram.WebApp.expand(); if (Telegram.WebApp.initData) INIT = Telegram.WebApp.initData; } } catch {}
      if (!INIT) { const m = location.hash.match(/(?:^#|&)init=([^&]+)/); if (m) { try { INIT = decodeURIComponent(m[1]); } catch {} } }
    })();
    let TAB = 'users';
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/'/g, '&#39;');
    const fmt = (n) => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const when = (t) => t ? new Date(t).toLocaleString() : '—';
    const ago = (t) => { if (!t) return '—'; const s = (Date.now() - t) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago'; return Math.floor(s / 86400) + 'd ago'; };

    async function api(payload) {
      const r = await fetch('/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ secret: SECRET, initData: INIT, ...payload }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || ('Error ' + r.status));
      return d;
    }
    function copy(t) { try { navigator.clipboard.writeText(t); } catch {} }

    async function login() {
      SECRET = $('secret').value.trim(); if (!SECRET) return;
      try { await api({ action: 'users' }); sessionStorage.setItem('kx_admin', SECRET); $('gate').style.display = 'none'; $('app').style.display = 'block'; afterUnlock(); refresh(); }
      catch (e) { $('gate-err').textContent = e.message; }
    }
    function logout() { sessionStorage.removeItem('kx_admin'); location.reload(); }
    function setTab(t) { TAB = t; ['users','wd','dep','sup','tasks','banners','partners'].forEach(x => $('tab-' + x).classList.toggle('on', t === x)); if (t !== 'sup') stopThreadPoll(); refresh(); }
    function refresh() { TAB === 'users' ? loadUsers() : TAB === 'wd' ? loadWithdrawals() : TAB === 'dep' ? loadDeposits() : TAB === 'sup' ? loadConversations() : TAB === 'tasks' ? loadTasks() : TAB === 'banners' ? loadBanners() : loadPartners(); }

    /* ── Deposits report ── */
    async function loadDeposits() {
      $('view').innerHTML = '<div class="empty">Loading…</div>';
      try {
        const d = await api({ action: 'deposits' }); const list = d.deposits || [];
        $('count').textContent = list.length + ' deposits';
        const total = list.reduce((s, x) => s + (parseFloat(x.usd) || 0), 0);
        const head = '<div class="card"><div class="row"><span class="k">Total (last ' + list.length + ')</span><span class="val amt" style="font-size:16px;">$' + fmt(total) + '</span></div></div>';
        $('view').innerHTML = head + (list.length ? list.map(depCard).join('') : '<div class="empty">No deposits yet</div>');
      } catch (e) { $('view').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
    }
    function depCard(x) {
      const isAdj = x.coin === 'ADMIN', isRef = x.coin === 'REFERRAL';
      const title = isRef ? 'Referral bonus' : isAdj ? 'Admin credit' : 'Deposit';
      return '<div class="card"><div class="row" style="align-items:center;"><span class="amt" style="font-size:17px;">+$' + fmt(x.usd) + '</span>'
        + '<span class="net">' + esc(title) + '</span></div>'
        + (x.coin && !isAdj && !isRef ? '<div class="row"><span class="k">Asset · Network</span><span class="val">' + esc(x.coin) + (x.network && x.network !== x.coin ? ' · ' + esc(x.network) : '') + '</span></div>' : '')
        + (x.actuallyPaid ? '<div class="row"><span class="k">Received</span><span class="val">' + esc(x.actuallyPaid) + ' ' + esc(x.coin || '') + '</span></div>' : '')
        + '<div class="row"><span class="k">User</span><span class="val" style="cursor:pointer;color:#5d9bf5;" onclick="openUser(\'' + esc(x.userId) + '\')">' + esc(x.userId) + '</span></div>'
        + (x.paymentId ? '<div class="row"><span class="k">Payment ID</span><span class="val">' + esc(x.paymentId) + '</span></div>' : '')
        + (x.note ? '<div class="row"><span class="k">Note</span><span class="val">' + esc(x.note) + '</span></div>' : '')
        + '<div class="row"><span class="k">Time</span><span class="val">' + when(x.at) + '</span></div></div>';
    }

    /* ── Withdrawals ── */
    async function decide(id, decision) {
      if (decision === 'reject' && !confirm('Reject and refund this withdrawal?')) return;
      if (decision === 'paid' && !confirm('Confirm you have SENT the crypto to the address?')) return;
      try { await api({ action: 'decide', id, decision }); loadWithdrawals(); } catch (e) { alert(e.message); }
    }
    function wdCard(w) {
      const acts = (w.status === 'pending' || w.status === 'approved')
        ? '<div class="acts">'
          + (w.status === 'pending' ? '<button class="btn" onclick="decide(\'' + w.id + '\',\'approve\')">Approve</button>' : '')
          + '<button class="btn amber" onclick="decide(\'' + w.id + '\',\'paid\')">Mark Paid</button>'
          + '<button class="btn red" onclick="decide(\'' + w.id + '\',\'reject\')">Reject</button></div>' : '';
      // What to actually send. The card used to show only the USD value, which
      // for a BTC payout left the admin working out the coin amount by hand —
      // and now that a network fee is deducted, the gross is the wrong number
      // to send. The net leads, in the coin, and is copyable.
      const net = w.netCoin != null ? w.netCoin : w.coinAmount;
      const feeC = parseFloat(w.feeCoin) || 0;
      const sendLine = net != null
        ? '<div class="row" style="align-items:center;background:#0f1a14;border-radius:9px;padding:8px 10px;margin:6px 0;">'
          + '<span class="k" style="color:#4eeaa0;font-weight:700;">SEND</span>'
          + '<span class="val" style="color:#4eeaa0;font-size:15px;font-weight:800;">' + esc(String(net)) + ' ' + esc(w.coin || '')
          + ' <i class="ti ti-copy copy" onclick="copy(\'' + esc(String(net)) + '\')"></i></span></div>'
        : '';
      const feeRow = (w.coinAmount != null)
        ? '<div class="row"><span class="k">Requested \u00b7 fee</span><span class="val">' + esc(String(w.coinAmount)) + ' ' + esc(w.coin || '')
          + (feeC > 0 ? ' \u2212 ' + esc(String(w.feeCoin)) + ' fee' : ' \u00b7 no fee') + '</span></div>'
        : '';
      // The headline is the USD value of the payout. Labelling it "USDT" on a BTC
      // withdrawal read as though 1,040 USDT were going out; the coin figure that
      // actually gets sent is the SEND row below.
      const head = w.coin === 'USDT' ? fmt(w.amount) + ' USDT' : '$' + fmt(w.amount);
      return '<div class="card"><div class="row" style="align-items:center;"><span class="amt">' + head + '</span>'
        + '<span style="display:flex;gap:8px;align-items:center;"><span class="net">' + esc(w.network) + '</span><span class="st ' + esc(w.status) + '">' + esc(w.status) + '</span></span></div>'
        + sendLine + feeRow
        + '<div class="row"><span class="k">Address</span><span class="val">' + esc(w.address) + ' <i class="ti ti-copy copy" onclick="copy(\'' + esc(w.address) + '\')"></i></span></div>'
        + (w.memo ? '<div class="row"><span class="k">Memo</span><span class="val">' + esc(w.memo) + '</span></div>' : '')
        + '<div class="row"><span class="k">User</span><span class="val">' + esc(w.username ? '@' + w.username : (w.name || '')) + ' (' + esc(w.userId) + ')</span></div>'

    async function loadWithdrawals() {

    /* ── Users ── */

    async function loadUsers() {
      $('view').innerHTML = '<div class="search"><i class="ti ti-search" style="color:#7a8299;"></i><input id="usearch" placeholder="Search name, username or id" oninput="renderUsers()"></div><div id="ulist"><div class="empty">Loading…</div></div>';

    async function openUser(id) {

    function posRow(id, p) {
      return '<div class="li"><div class="top"><span class="' + (p.side === 'long' ? 'long' : 'short') + '">' + esc(p.pair) + ' ' + esc((p.side || '').toUpperCase()) + ' ' + (p.lev || '') + 'x</span>'
        + '<span>uPnL ' + fmt(p.upnl) + '</span></div>'

        + '<div class="acts"><button class="btn red" onclick="cmdClose(\'' + esc(id) + '\',' + p.id + ')">Force Close</button>'

    function txRow(t) {

        + '<div class="mini">' + esc(t.sub || '') + ' · ' + esc(t.time || '') + '</div></div>';

    let CUR = null;
    function renderUser(d) {
      CUR = d; const p = d.profile || {}; const id = p.userId;
      const positions = p.positions || [], orders = p.openOrders || [], holdings = p.holdings || [], txs = p.txs || [], deposits = d.deposits || [], wds = d.withdrawals || [];

        + '<div><div class="u-name">' + esc(p.name || p.username || 'User') + '</div><div class="u-id">' + (p.username ? '@' + esc(p.username) + ' · ' : '') + esc(id) + '</div></div>'
        + '<div style="margin-left:auto;">' + (d.banned ? '<span class="st banned">banned</span>' : '<span class="st paid">active</span>') + '</div></div>'
        + '<div class="row"><span class="k">Joined</span><span class="val">' + when(p.joinedAt) + '</span></div>'
        + '<div class="row"><span class="k">Last seen</span><span class="val">' + when(p.lastSeen) + '</span></div>'
        + '<div class="row"><span class="k">Invited friends</span><span class="val">' + (d.referral ? d.referral.count : 0) + '</span></div>'
        + (d.referral && d.referral.referredBy ? '<div class="row"><span class="k">Referred by</span><span class="val">' + esc(d.referral.referredBy) + '</span></div>' : '')
        + '</div>';

      // Balances
      h += '<div class="grid2">'
        + '<div class="stat"><div class="l">Real balance</div><div class="v" style="color:#4eeaa0;">$' + fmt(d.balance) + '</div></div>'
        + '<div class="stat"><div class="l">Bonus</div><div class="v" style="color:#f0b90b;">' + fmt(p.bonus) + '</div></div>'
        + '<div class="stat"><div class="l">Equity ≈</div><div class="v">$' + fmt(p.equity) + '</div></div>'
        + '<div class="stat"><div class="l">Spot / Fut USDT</div><div class="v">' + fmt(p.usdt) + ' / ' + fmt(p.futUSDT) + '</div></div></div>';

      // Controls
      h += '<div class="sec-title">Controls</div><div class="card">'
        + '<div class="row"><span class="k">Adjust real balance (USDT)</span></div>'
        // A phone number pad has no minus key, so the sign is a button rather
        // than something the admin has to type.
        + '<div class="adj"><input id="adj-amt" inputmode="decimal" placeholder="amount, e.g. 50"><input id="adj-note" placeholder="note (optional)" style="flex:1.4;"></div>'
        + '<div class="acts" style="margin-top:6px;">'
        +   '<button class="btn" onclick="doAdjust(\'' + esc(id) + '\',1)"><i class="ti ti-plus"></i> Add</button>'
        +   '<button class="btn red" onclick="doAdjust(\'' + esc(id) + '\',-1)"><i class="ti ti-minus"></i> Deduct</button>'
        + '</div>'
        + '<label class="mini" style="display:flex;align-items:center;gap:7px;margin-top:6px;cursor:pointer;">'
        +   '<input type="checkbox" id="adj-comm" checked style="width:auto;"> Treat as a real deposit &mdash; pays partner commission and shows in their referral list'
        + '</label>'
        + '<div class="row" style="margin-top:12px;"><span class="k">Adjust bonus (USDT) — notifies user</span></div>'
        + '<div class="adj"><input id="bon-amt" inputmode="decimal" placeholder="amount, e.g. 10"><input id="bon-note" placeholder="note to user (optional)" style="flex:1.4;"></div>'
        + '<div class="acts" style="margin-top:6px;">'
        +   '<button class="btn amber" onclick="doBonus(\'' + esc(id) + '\',1)"><i class="ti ti-plus"></i> Add bonus</button>'
        +   '<button class="btn red" onclick="doBonus(\'' + esc(id) + '\',-1)"><i class="ti ti-minus"></i> Deduct bonus</button>'
        + '</div>'
        + '<div class="row" style="margin-top:14px;"><span class="k">Coupons</span></div>'
        + '<div class="adj"><input id="cp-amt" inputmode="decimal" placeholder="amount, e.g. 25"><input id="cp-title" placeholder="title (optional)" style="flex:1.4;"><input id="cp-days" inputmode="numeric" placeholder="days" style="flex:.5;" value="7"></div>'
        + '<div class="acts" style="margin-top:6px;">'
        +   '<button class="btn amber" onclick="sendCoupon(\'' + esc(id) + '\')"><i class="ti ti-ticket"></i> Send coupon</button>'
        +   '<button class="btn sec" onclick="loadCoupons(\'' + esc(id) + '\')"><i class="ti ti-refresh"></i> Show coupons</button>'
        + '</div>'
        + '<div id="cp-list" class="mini" style="margin-top:8px;">Tap “Show coupons” to load.</div>'
        + '<div class="acts" style="margin-top:12px;">'
        + (d.banned ? '<button class="btn" onclick="doBan(\'' + esc(id) + '\',\'unban\')">Unban user</button>' : '<button class="btn red" onclick="doBan(\'' + esc(id) + '\',\'ban\')">Ban user</button>')
        + '<button class="btn sec" onclick="cmdMessage(\'' + esc(id) + '\')">Send message</button></div>'

        + '<div class="acts">'
        + '<button class="btn amber" onclick="doReset(\'' + esc(id) + '\',\'tasks\')">Reset tasks only</button>'
        + '<button class="btn red" onclick="doReset(\'' + esc(id) + '\',\'full\')">Reset full account</button></div>'
        + '<div class="mini" style="margin-top:6px;">“Tasks only” clears tasks, daily check-in, unactivated coupons &amp; deposit tiers — the bonus balance is kept. “Full account” wipes balance, positions, history — like a brand-new user.</div></div>';

      h += '<div class="sec-title">Open positions (' + positions.length + ')</div>' + (positions.length ? positions.map(x => posRow(id, x)).join('') : '<div class="empty" style="padding:14px;">None</div>');

      if (holdings.length) h += '<div class="sec-title">Holdings</div>' + holdings.map(x => '<div class="li"><div class="top"><span>' + esc(x.coin) + '</span><span>' + (x.amount) + (x.value ? ' ≈ $' + fmt(x.value) : '') + '</span></div></div>').join('');
      h += '<div class="sec-title">Recent transactions</div>' + (txs.length ? txs.map(txRow).join('') : '<div class="empty" style="padding:14px;">None</div>');
      if (wds.length) h += '<div class="sec-title">Withdrawals</div>' + wds.map(w => '<div class="li"><div class="top"><span>' + fmt(w.amount) + ' USDT · ' + esc(w.network) + '</span><span class="st ' + esc(w.status) + '">' + esc(w.status) + '</span></div><div class="mini">' + esc(w.address || '') + '</div></div>').join('');
      if (deposits.length) h += '<div class="sec-title">Deposits / credits</div>' + deposits.map(x => '<div class="li"><div class="top"><span>' + esc(x.coin || '') + '</span><span>+$' + fmt(x.usd) + '</span></div>' + (x.note ? '<div class="mini">' + esc(x.note) + '</div>' : '') + '</div>').join('');
      $('view').innerHTML = h;
    }

    // `sign` comes from the Add / Deduct button. A typed leading minus is still
    // honoured, but the buttons mean it is never required.
    async function doAdjust(id, sign) {
      const raw = parseFloat($('adj-amt').value);
      const amount = Math.abs(raw) * (sign < 0 ? -1 : 1) * (raw < 0 ? -1 : 1);
      const note = $('adj-note').value.trim();
      const box = $('adj-comm');
      // Only meaningful for a credit; a deduction never pays commission.
      const payCommission = amount > 0 && (!box || box.checked);
      if (!amount || !isFinite(amount)) return alert('Enter a non-zero amount, e.g. 50');
      const extra = payCommission
        ? '\n\nIf this user came through a partner link, their partner will be paid commission and notified.'
        : '';
      if (!confirm((amount > 0 ? 'Add ' : 'Deduct ') + Math.abs(amount) + ' USDT?' + extra)) return;
      try {
        const d = await api({ action: 'adjust', id, amount, note, payCommission });
        if (d && d.commissionPaid) console.log('partner commission attempted for', id);
        openUser(id);
      } catch (e) { alert(e.message); }
    }
    async function doBonus(id, sign) {
      const raw = parseFloat($('bon-amt').value);
      const amount = Math.abs(raw) * (sign < 0 ? -1 : 1) * (raw < 0 ? -1 : 1);
      const note = $('bon-note').value.trim();
      if (!amount || !isFinite(amount)) return alert('Enter a non-zero bonus amount, e.g. 10');
      if (!confirm((amount > 0 ? 'Add ' : 'Deduct ') + Math.abs(amount) + ' USDT bonus? The user will be notified.')) return;
      try { await api({ action: 'bonus', id, amount, note }); alert('Bonus queued — applies on the user\'s next sync; a bot message was sent now.'); openUser(id); } catch (e) { alert(e.message); }
    }
    async function doBan(id, action) {
      if (!confirm(action === 'ban' ? 'Ban this user? They will be locked out.' : 'Unban this user?')) return;
      try { await api({ action, id }); openUser(id); } catch (e) { alert(e.message); }
    }
    async function doReset(id, mode) {
      const msg = mode === 'full'
        ? 'FULL RESET this user?\n\nThis wipes their balance, positions, history, tasks and deposits — they become a brand-new user. This cannot be undone.'
        : 'Reset only this user\'s tasks, daily check-in, coupons and deposit tiers?\n\nBalances (including their bonus) and positions are kept.';
      if (!confirm(msg)) return;
      if (mode === 'full' && !confirm('Are you sure? The user\'s balance and all data will be permanently erased.')) return;
      try { await api({ action: 'reset', id, mode }); alert(mode === 'full' ? 'Full reset queued — applies on the user\'s next sync.' : 'Task reset queued — applies on the user\'s next sync.'); openUser(id); }
      catch (e) { alert(e.message); }
    }
    async function sendCmd(id, command, reopen) {
      try { await api({ action: 'command', id, command }); alert('Command queued — applies on the user\'s next sync (within ~1 min).'); if (reopen) openUser(id); }
      catch (e) { alert(e.message); }
    }
    function cmdClose(id, posId) { if (confirm('Force-close this position on the user\'s account?')) sendCmd(id, { type: 'closePosition', posId }); }
    function cmdCancel(id, orderId) { if (confirm('Cancel this open order?')) sendCmd(id, { type: 'cancelOrder', orderId }); }
    function cmdEdit(id, posId) {
      const tp = prompt('New Take-Profit price (blank = no change, 0 = remove):'); if (tp === null) return;
      const sl = prompt('New Stop-Loss price (blank = no change, 0 = remove):'); if (sl === null) return;
      const cmd = { type: 'editPosition', posId };
      if (tp.trim() !== '') cmd.tp = parseFloat(tp) || 0;
      if (sl.trim() !== '') cmd.sl = parseFloat(sl) || 0;
      sendCmd(id, cmd);
    }
    function cmdMessage(id) { const text = prompt('Message to show the user:'); if (text && text.trim()) sendCmd(id, { type: 'message', text: text.trim() }); }

    /* ── Task management ── */
    let TASKS_CACHE = [];
    const METRICS = ['always', 'deposit', 'spotVol', 'futVol', 'referral', 'tgChannel', 'xFollow'];
    const GOES = ['home', 'assets', 'trade', 'futures', 'invite', 'social'];
    async function loadTasks() {
      $('view').innerHTML = '<div class="empty">Loading…</div>';
      try { const d = await api({ action: 'getTasks' }); TASKS_CACHE = d.tasks || []; $('count').textContent = TASKS_CACHE.length + ' tasks'; renderTasksEditor(); }
      catch (e) { $('view').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
    }
    function renderTasksEditor() {
      let h = '<div class="mini" style="margin-bottom:10px;">Edit the home-screen tasks. <b>metric</b> drives progress: always (instant), deposit, spotVol, futVol, referral, tgChannel (verifies channel join — bot must be channel admin), xFollow (open X & follow). <b>target</b> is the goal (0 = instant). <b>reward</b> is the bonus in USDT. <b>link</b> + go=<code>social</code> is the URL the Go button opens (Telegram/X).</div>';
      h += TASKS_CACHE.map((t, i) => taskEditCard(t, i)).join('');
      h += '<div class="acts" style="margin-top:8px;"><button class="btn sec" onclick="addTaskRow()"><i class="ti ti-plus"></i> Add task</button>'
        + '<button class="btn" onclick="saveTasks()"><i class="ti ti-device-floppy"></i> Save all</button>'
        + '<button class="btn red" onclick="resetTasks()">Reset to default</button></div>';
      $('view').innerHTML = h;
    }
    function taskEditCard(t, i) {
      const opt = (arr, val) => arr.map(x => '<option' + (x === val ? ' selected' : '') + '>' + x + '</option>').join('');
      return '<div class="card" data-ti="' + i + '">'
        + '<div class="row" style="align-items:center;"><span style="font-weight:700;color:#cfd6e6;">#' + (i + 1) + '</span><button class="btn red" style="padding:5px 10px;font-size:12px;" onclick="delTaskRow(' + i + ')">Remove</button></div>'
        + '<div class="adj"><input data-f="title" placeholder="Title" value="' + esc(t.title || '') + '" style="flex:1.3;"><input data-f="reward" inputmode="decimal" placeholder="Reward" value="' + esc(t.reward) + '"></div>'
        + '<div class="adj"><input data-f="desc" placeholder="Description" value="' + esc(t.desc || '') + '" style="flex:2;"></div>'
        + '<div class="adj"><input data-f="id" placeholder="id" value="' + esc(t.id || '') + '"><input data-f="icon" placeholder="ti-icon" value="' + esc(t.icon || 'ti-gift') + '"></div>'
        + '<div class="adj"><input data-f="link" placeholder="link (for go=social, e.g. https://t.me/KolonoEX)" value="' + esc(t.link || '') + '" style="flex:2;"></div>'
        + '<div class="adj"><select data-f="metric" style="flex:1;background:#0f1117;border:0.5px solid #2e3347;color:#e8edf7;border-radius:9px;padding:9px;">' + opt(METRICS, t.metric || 'always') + '</select>'
        + '<input data-f="target" inputmode="decimal" placeholder="target" value="' + esc(t.target || 0) + '">'
        + '<select data-f="go" style="flex:1;background:#0f1117;border:0.5px solid #2e3347;color:#e8edf7;border-radius:9px;padding:9px;">' + opt(GOES, t.go || 'home') + '</select></div></div>';
    }
    function collectTasks() {
      return [...document.querySelectorAll('#view .card[data-ti]')].map(card => {
        const g = f => { const el = card.querySelector('[data-f="' + f + '"]'); return el ? el.value : ''; };
        return { id: g('id'), icon: g('icon'), title: g('title'), desc: g('desc'), reward: parseFloat(g('reward')) || 0, metric: g('metric'), target: parseFloat(g('target')) || 0, go: g('go'), link: g('link') };
      });
    }
    function addTaskRow() { TASKS_CACHE = collectTasks(); TASKS_CACHE.push({ id: 'task' + (TASKS_CACHE.length + 1), icon: 'ti-gift', title: 'New task', desc: '', reward: 1, metric: 'always', target: 0, go: 'home', link: '' }); renderTasksEditor(); }
    function delTaskRow(i) { TASKS_CACHE = collectTasks(); TASKS_CACHE.splice(i, 1); renderTasksEditor(); }
    async function saveTasks() {
      const tasks = collectTasks();
      if (tasks.some(t => !t.id || !t.title)) return alert('Every task needs an id and a title.');
      try { const d = await api({ action: 'saveTasks', tasks }); TASKS_CACHE = d.tasks || tasks; alert('Tasks saved — live for all users on their next sync.'); renderTasksEditor(); }
      catch (e) { alert(e.message); }
    }
    async function resetTasks() {
      if (!confirm('Reset all tasks to the built-in defaults?')) return;
      try { const d = await api({ action: 'resetTasksConfig' }); TASKS_CACHE = d.tasks || []; renderTasksEditor(); } catch (e) { alert(e.message); }
    }


    /* ── Coupons for one user ── */
    // Coupon state is: new (activatable), active (already paid into the bonus
    // balance) or expired. Only the first can be removed — see api/admin.js.
    function cpState(c, now) {
      if (!c) return 'expired';
      if (c.status === 'active') return 'active';
      return (Number(c.exp) || 0) > now ? 'new' : 'expired';
    }
    async function loadCoupons(id) {
      const box = $('cp-list'); if (box) box.textContent = 'Loading\u2026';
      try {
        const d = await api({ action: 'getCoupons', id });
        renderCoupons(id, d.coupons || [], d.now || Date.now(), d.bonus || 0);
      } catch (e) { if (box) box.innerHTML = '<span style="color:#ff7a7a;">' + esc(e.message) + '</span>'; }
    }
    function renderCoupons(id, list, now, bonus) {
      const box = $('cp-list'); if (!box) return;
      if (!list.length) { box.textContent = 'No coupons.'; return; }
      const COL = { new: '#4eeaa0', active: '#f0b90b', expired: '#6b7280' };
      box.innerHTML = '<div style="margin-bottom:6px;">Bonus balance: <b style="color:#f0b90b;">$' + fmt(bonus) + '</b></div>'
        + list.map((c) => {
          const st = cpState(c, now);
          const canDel = st !== 'active';
          return '<div class="row" style="align-items:center;border-top:0.5px solid #232838;padding:7px 0;">'
            + '<span class="val" style="flex:1;min-width:0;">'
            +   '<b style="color:' + COL[st] + ';">$' + fmt(c.amount) + '</b> \u00b7 ' + esc(c.title || '')
            +   '<br><span class="k">' + st + ' \u00b7 ' + when(c.at) + (st === 'new' ? ' \u00b7 expires ' + when(c.exp) : '') + '</span>'
            + '</span>'
            + (canDel
                ? '<button class="btn red" style="padding:4px 9px;font-size:12px;" onclick="deleteCoupon(\'' + esc(id) + '\',\'' + esc(c.id) + '\')">Remove</button>'
                : '<span class="k">activated</span>')
            + '</div>';
        }).join('');
    }
    async function sendCoupon(id) {
      const amount = parseFloat($('cp-amt').value);
      const title = ($('cp-title').value || '').trim();
      const days = parseInt($('cp-days').value, 10) || 7;
      if (!amount || !isFinite(amount) || amount <= 0) return alert('Enter a positive amount, e.g. 25');
      if (!confirm('Send a ' + amount + ' USDT coupon?\n\nIt expires in ' + days + ' day(s) and the user is notified. It only reaches their bonus balance once they activate it.')) return;
      try {
        const d = await api({ action: 'sendCoupon', id, amount, title, days });
        $('cp-amt').value = ''; $('cp-title').value = '';
        renderCoupons(id, d.coupons || [], Date.now(), 0);
        loadCoupons(id);
      } catch (e) { alert(e.message); }
    }
    async function deleteCoupon(id, couponId) {
      if (!confirm('Remove this coupon? It disappears from the user\'s Coupon Center.')) return;
      try { const d = await api({ action: 'deleteCoupon', id, couponId }); renderCoupons(id, d.coupons || [], Date.now(), 0); loadCoupons(id); }
      catch (e) { alert(e.message); }
    }

    /* \u2500\u2500 Partner management \u2500\u2500 */
    let PARTNERS = [];
    async function loadPartners() {
      $('view').innerHTML = '<div class="empty">Loading…</div>';
      try {
        // Ensure we know the current task ids so the per-partner bonus hint is accurate.
        if (!TASKS_CACHE.length) { try { const td = await api({ action: 'getTasks' }); TASKS_CACHE = td.tasks || []; } catch {} }
        const d = await papi({ action: 'list' }); PARTNERS = d.partners || []; $('count').textContent = PARTNERS.length + ' partners';
        if (!PARTNERS.length) { $('view').innerHTML = '<div class="empty">No partner applications yet</div>'; return; }
        // pending first, then approved, then rejected

    async function papi(payload) {

      const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || ('Error ' + r.status)); return d;
    }
    function partnerCard(p) {
      const cfg = p.cfg || {};
      const uid = esc(p.userId);
      const approved = p.status === 'approved';
      const head = '<div class="row" style="align-items:center;"><span style="font-weight:700;">' + esc(p.name || p.userId) + (p.username ? ' <span style="color:#7a8299;">@' + esc(p.username) + '</span>' : '') + '</span>'

        + (p.note ? '<div class="mini">' + esc(p.note) + '</div>' : '')
        + '<div class="mini">ID: <code>' + esc(String(p.userId).replace('tg_', '')) + '</code>' + (p.code ? ' · link code: <code>' + esc(p.code) + '</code>' : '') + '</div>'

      const tr = cfg.taskRewards || {};
      const trStr = Object.keys(tr).map(k => k + ':' + tr[k]).join(', ');
      // Build a hint listing the current task ids so admin knows what to type.
      const taskIds = (TASKS_CACHE.length ? TASKS_CACHE : []).map(t => t.id).join(', ') || 'deposit, spot, futures…';

      const terms = '<div class="psec"><div class="psec-t">' + (approved ? 'Partner terms' : 'Set terms, then approve') + '</div>'
        + '<div class="pf-grid">'
        + '<div class="pfield"><label>Deposit commission (%)</label><div class="hint">% of each referral\'s deposit paid to the partner</div>'
        + '<input id="pp-dep-' + uid + '" inputmode="decimal" placeholder="e.g. 10" value="' + esc(cfg.depositPct != null ? cfg.depositPct : 10) + '"></div>'
        + '<div class="pfield"><label>Referral bonus ($)</label><div class="hint">paid to the partner per new referral</div>'
        + '<input id="pp-ref-' + uid + '" inputmode="decimal" placeholder="e.g. 0.5" value="' + esc(cfg.refBonus != null ? cfg.refBonus : 0.5) + '"></div></div>'

        + '<div class="hint">Override the bonus each task gives to THIS partner\'s referrals. Format: <code>taskId:amount</code>, comma-separated. Available task ids: ' + esc(taskIds) + '<br>Example: <code>deposit:20, spot:10</code></div>'

          ? '<button class="btn" onclick="partnerSave(\'' + uid + '\',\'update\')"><i class="ti ti-device-floppy"></i> Save changes</button><button class="btn red" onclick="partnerDelete(\'' + uid + '\')"><i class="ti ti-trash"></i> Remove partner</button>'

        + '</div>';

    function parseTaskRewards(str) {
      const out = {}; (str || '').split(',').forEach(part => { const m = part.split(':'); if (m.length === 2) { const k = m[0].trim(); const val = parseFloat(m[1]); if (k && isFinite(val)) out[k] = val; } }); return out;
    }
    async function partnerSave(userId, action) {
      const depositPct = parseFloat($('pp-dep-' + userId).value) || 0;
      const refBonus = parseFloat($('pp-ref-' + userId).value) || 0;
      const taskRewards = parseTaskRewards($('pp-tasks-' + userId).value);
      if (action === 'approve' && !confirm('Approve this partner?\n\n• Deposit commission: ' + depositPct + '%\n• Referral bonus: $' + refBonus)) return;
      try { await papi({ action, userId, depositPct, refBonus, taskRewards }); alert(action === 'approve' ? 'Partner approved! Their link is now active.' : 'Changes saved.'); loadPartners(); }

    /* ── Support chat (admin side) ── */
    let supThread = null, threadPoll = null, hbPoll = null, supList = [];
    async function supApi(payload) {
      const r = await fetch('/api/support', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ secret: SECRET, initData: INIT, ...payload }) });
      const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || ('Error ' + r.status)); return d;

    function stopThreadPoll() { if (threadPoll) { clearInterval(threadPoll); threadPoll = null; } supThread = null; }
    const supTime = (at) => { const d = new Date(at); const p = x => String(x).padStart(2, '0'); return p(d.getHours()) + ':' + p(d.getMinutes()); };
    async function loadConversations() {

    function convCard(c) {

    }
    // The thread used to be re-rendered wholesale every five seconds, which
    // rebuilt the reply box and threw away whatever was half-typed in it. The
    // shell (header + scroll area + composer) is now built once per
    // conversation; polling only touches the message list, and only when the
    // messages have actually changed.
    let supMsgs = [], supSig = '', supPendingImg = null;

    async function openThread(userId) {

    function buildThreadShell() {

      const id = esc(String(supThread).replace('tg_', ''));
      $('view').innerHTML =
        '<div class="back" onclick="backToList()"><i class="ti ti-arrow-left"></i> All conversations</div>'

        + '<span style="font-weight:700;">' + esc(conv.name || supThread) + (conv.username ? ' <span style="color:#7a8299;font-weight:400;">@' + esc(conv.username) + '</span>' : '') + '</span>'
        + '<span class="k click" onclick="copy(\'' + id + '\')" title="Copy ID">ID: ' + id + ' <i class="ti ti-copy" style="font-size:10px;"></i></span>'
        + '</div></div>'
        + '<div id="sup-thread" style="display:flex;flex-direction:column;gap:6px;margin:0 0 10px;max-height:60vh;overflow-y:auto;padding:4px 2px;"><div class="empty">Loading…</div></div>'
        + '<div id="sup-imgchip" style="display:none;align-items:center;gap:8px;margin-bottom:6px;background:#161a26;border:0.5px solid #2a3142;border-radius:10px;padding:6px 8px;">'
        + '<img id="sup-imgprev" style="width:34px;height:34px;object-fit:cover;border-radius:6px;">'
        + '<span class="mini" id="sup-imgname" style="flex:1;">Photo attached</span>'

    function supGrowAdmin(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 110) + 'px'; }
    function supReplyKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendReply(); } }

    // Down-scale in the browser so the wire payload stays small; the API caps at 5 MB.
    function shrinkImage(file, cb) {
      const fr = new FileReader();
      fr.onload = () => {
        const im = new Image();
        im.onload = () => {
          const max = 1280, sc = Math.min(1, max / Math.max(im.width, im.height));
          const c = document.createElement('canvas');
          c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
          c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
          cb(c.toDataURL('image/jpeg', 0.82));
        };
        im.onerror = () => cb(null);
        im.src = fr.result;
      };
      fr.onerror = () => cb(null);
      fr.readAsDataURL(file);
    }
    function attachReplyImg(file) {
      if (!file || !/^image\//.test(file.type)) return;
      shrinkImage(file, (d) => {
        if (!d) { alert('Could not read that image.'); return; }
        supPendingImg = d;
        $('sup-imgprev').src = d; $('sup-imgname').textContent = file.name || 'Photo';
        $('sup-imgchip').style.display = 'flex';
      });
    }
    function pickReplyImg(inp) { attachReplyImg(inp.files && inp.files[0]); inp.value = ''; }
    function clearReplyImg() { supPendingImg = null; const c = $('sup-imgchip'); if (c) c.style.display = 'none'; }
    function supPaste(e) {
      const items = (e.clipboardData && e.clipboardData.items) || [];
      for (const it of items) if (it.type && it.type.indexOf('image') === 0) { const f = it.getAsFile(); if (f) { e.preventDefault(); attachReplyImg(f); return; } }
    }

    async function renderThread(scroll) {
      if (!supThread) return;
      try {
        const d = await supApi({ action: 'thread', userId: supThread });
        supMsgs = d.messages || [];
        const sig = supMsgs.map(m => m.id).join(',');
        if (sig === supSig && !scroll) return;      // nothing new → leave the DOM alone
        supSig = sig;
        paintThread(scroll);
      } catch (e) {
        const t = $('sup-thread');
        if (t) t.innerHTML = '<div class="err">' + esc(e.message) + '</div>';
        else $('view').innerHTML = '<div class="err">' + esc(e.message) + '</div>';

    }
    function paintThread(scroll) {
      const t = $('sup-thread'); if (!t) return;
      const near = t.scrollHeight - t.scrollTop - t.clientHeight < 80;
      t.innerHTML = supMsgs.length ? supMsgs.map(bubble).join('') : '<div class="empty">No messages</div>';
      if (scroll || near) t.scrollTop = t.scrollHeight;

    function bubble(m) {
      const mine = m.from === 'admin';
      const skin = mine
        ? 'background:linear-gradient(135deg,#4eeaa0,#3fd190);color:#0d2018;border-bottom-right-radius:4px;'
        : 'background:#1c2030;color:#e8edf7;border:0.5px solid #2a3142;border-bottom-left-radius:4px;';
      const img = m.img ? '<img src="' + esc(m.img) + '" onclick="lightbox(\'' + esc(m.img) + '\')" '
        + 'style="display:block;max-width:100%;width:190px;border-radius:9px;margin-bottom:' + (m.text ? '6px' : '0') + ';cursor:zoom-in;object-fit:cover;">' : '';
      const txt = m.text ? '<div>' + esc(m.text).replace(/\n/g, '<br>') + '</div>' : '';
      const cp = m.text ? '<i class="ti ti-copy click" title="Copy" onclick="copyMsg(this)" data-t="' + escAttr(m.text) + '" style="font-size:11px;opacity:.55;"></i>' : '';
      return '<div style="max-width:82%;align-self:' + (mine ? 'flex-end' : 'flex-start') + ';' + skin
        + 'padding:7px 10px;border-radius:14px;font-size:13px;line-height:1.5;word-break:break-word;">'
        + img + txt
        + '<div style="display:flex;align-items:center;gap:6px;justify-content:flex-end;font-size:9px;opacity:.65;margin-top:3px;">'
        + cp + '<span>' + supTime(m.at) + '</span></div></div>';

    const escAttr = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    function copyMsg(el) { copy(el.getAttribute('data-t') || ''); }
    function lightbox(src) {
      const w = document.createElement('div');
      w.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';
      w.onclick = () => w.remove();
      const i = document.createElement('img');
      i.src = src; i.style.cssText = 'max-width:100%;max-height:100%;border-radius:10px;';
      w.appendChild(i); document.body.appendChild(w);

    function backToList() { stopThreadPoll(); clearReplyImg(); loadConversations(); }
    async function sendReply() {
      const el = $('sup-reply'); if (!el || !supThread) return;

      if (!text && !image) return;
      const btn = $('sup-sendbtn'); if (btn) { btn.disabled = true; btn.textContent = '…'; }
      // Show it immediately; the poll will replace it with the stored copy.
      supMsgs.push({ id: 'tmp-' + Date.now(), from: 'admin', text, at: Date.now(), img: image || undefined });
      el.value = ''; supGrowAdmin(el); clearReplyImg(); paintThread(true);
      try {
        await supApi({ action: 'reply', userId: supThread, text, image: image || undefined });
        supSig = ''; await renderThread(true);
      } catch (e) {
        supMsgs.pop(); paintThread(true); alert(e.message);
        el.value = text; supGrowAdmin(el);
      }
      const b2 = $('sup-sendbtn'); if (b2) { b2.disabled = false; b2.textContent = 'Send'; }
      const e2 = $('sup-reply'); if (e2) e2.focus();
    }

    // Return to the mini app (the exchange). Used by the in-page back button and
    // the Telegram native back button when opened inside the mini app.
    function goExchange() { window.location.href = 'index.html'; }
    if (INIT) {
      $('backBtn').style.display = 'inline-flex';
      try { if (window.Telegram && Telegram.WebApp && Telegram.WebApp.BackButton) { Telegram.WebApp.BackButton.show(); Telegram.WebApp.BackButton.onClick(goExchange); } } catch {}
    }

    // Restore "online for chat" after unlocking; resume the heartbeat if it was on.
    function afterUnlock() {
      const on = sessionStorage.getItem('kx_online') === '1';
      const chk = $('onlineChk'); if (chk) { chk.checked = on; }
      if (on) toggleOnline();
    }

    // Boot: prefer Telegram in-app admin auth, fall back to a stored secret,
    // otherwise show the secret gate (web access).
    async function boot() {
      if (INIT) {
        try { await api({ action: 'users' }); $('gate').style.display = 'none'; $('app').style.display = 'block'; afterUnlock(); refresh(); return; }
        catch (e) { /* not an admin via Telegram — fall through to the gate */ }
      }
      if (SECRET) { $('gate').style.display = 'none'; $('app').style.display = 'block'; afterUnlock(); refresh(); }
    }
    boot();
  </script>
</body>
</html>
