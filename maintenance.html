<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KolonoEX - Under Maintenance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <style>
    :root {
      --bg: #0b0d12;
      --bg-glow: #0f1218;
      --surface: #141822;
      --text: #e8edf7;
      --text-2: #98a2b8;
      --text-3: #5f6981;
      --green: #4eeaa0;
      --green-glow: rgba(78, 234, 160, 0.25);
      --purple: #b07bff;
      --purple-glow: rgba(176, 123, 255, 0.2);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }
    
    /* Animated background */
    .bg-pattern {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0.4;
      background: 
        radial-gradient(circle at 20% 30%, var(--green-glow) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, var(--purple-glow) 0%, transparent 50%);
      animation: bgPulse 8s ease-in-out infinite alternate;
    }
    
    @keyframes bgPulse {
      0% { opacity: 0.3; transform: scale(1); }
      100% { opacity: 0.5; transform: scale(1.05); }
    }
    
    /* Floating particles */
    .particle {
      position: fixed;
      width: 3px;
      height: 3px;
      background: var(--green);
      border-radius: 50%;
      opacity: 0.3;
      animation: float 15s infinite ease-in-out;
    }
    
    .particle:nth-child(2) { left: 20%; animation-delay: 2s; animation-duration: 12s; }
    .particle:nth-child(3) { left: 40%; animation-delay: 4s; animation-duration: 18s; background: var(--purple); }
    .particle:nth-child(4) { left: 60%; animation-delay: 1s; animation-duration: 14s; }
    .particle:nth-child(5) { left: 80%; animation-delay: 3s; animation-duration: 16s; background: var(--purple); }
    
    @keyframes float {
      0%, 100% { transform: translateY(100vh) scale(0); opacity: 0; }
      50% { opacity: 0.4; }
      50%, 100% { transform: translateY(-100vh) scale(1); }
    }
    
    /* Main container */
    .container {
      position: relative;
      z-index: 10;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    
    /* Logo/Icon */
    .icon-wrap {
      margin-bottom: 32px;
      position: relative;
      display: inline-block;
    }
    
    .icon-circle {
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, var(--green) 0%, #2fb574 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      position: relative;
      animation: iconPulse 3s ease-in-out infinite;
      box-shadow: 0 0 60px var(--green-glow), 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    
    @keyframes iconPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    .icon-circle::before {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--green), var(--purple));
      opacity: 0.2;
      filter: blur(20px);
      animation: glowRotate 4s linear infinite;
    }
    
    @keyframes glowRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .icon-circle i {
      font-size: 56px;
      color: #0d0e12;
      animation: iconSpin 4s ease-in-out infinite;
    }
    
    @keyframes iconSpin {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-10deg); }
      75% { transform: rotate(10deg); }
    }
    
    /* Content */
    .title {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--text) 0%, var(--text-2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .message {
      font-size: 17px;
      color: var(--text-2);
      line-height: 1.6;
      margin-bottom: 32px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
    
    /* Countdown timer */
    .timer-wrap {
      background: var(--surface);
      border: 1px solid rgba(78, 234, 160, 0.2);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 32px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }
    
    .timer-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--green-glow), transparent);
      opacity: 0.1;
    }
    
    .timer-label {
      font-size: 13px;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
      margin-bottom: 12px;
    }
    
    .timer {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .timer-block {
      background: var(--bg-glow);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 16px 20px;
      min-width: 70px;
      position: relative;
    }
    
    .timer-value {
      font-size: 32px;
      font-weight: 800;
      color: var(--green);
      font-variant-numeric: tabular-nums;
      display: block;
      line-height: 1;
    }
    
    .timer-unit {
      font-size: 11px;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 6px;
      display: block;
    }
    
    /* Status badge */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(78, 234, 160, 0.12);
      border: 1px solid rgba(78, 234, 160, 0.3);
      border-radius: 100px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      color: var(--green);
    }
    
    .status i {
      font-size: 16px;
      animation: statusBlink 2s ease-in-out infinite;
    }
    
    @keyframes statusBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    
    /* Social links */
    .social {
      margin-top: 40px;
      padding-top: 32px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .social-label {
      font-size: 13px;
      color: var(--text-3);
      margin-bottom: 16px;
    }
    
    .social-links {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .social-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 100px;
      padding: 10px 18px;
      color: var(--text-2);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    
    .social-link:hover {
      border-color: var(--green);
      color: var(--green);
      transform: translateY(-2px);
    }
    
    .social-link i {
      font-size: 18px;
    }
    
    /* Responsive */
    @media (max-width: 480px) {
      .title {
        font-size: 26px;
      }
      
      .message {
        font-size: 15px;
      }
      
      .timer-block {
        min-width: 60px;
        padding: 12px 16px;
      }
      
      .timer-value {
        font-size: 28px;
      }
      
      .icon-circle {
        width: 100px;
        height: 100px;
      }
      
      .icon-circle i {
        font-size: 48px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  
  <div class="container">
    <div class="icon-wrap">
      <div class="icon-circle">
        <i class="ti ti-tool"></i>
      </div>
    </div>
    
    <h1 class="title">We'll Be Right Back</h1>
    <p class="message">KolonoEX is currently undergoing scheduled maintenance to bring you exciting new features and improvements.</p>
    
    <div class="timer-wrap" id="timerWrap" style="display: none;">
      <div class="timer-label">Expected completion in</div>
      <div class="timer">
        <div class="timer-block">
          <span class="timer-value" id="hours">00</span>
          <span class="timer-unit">Hours</span>
        </div>
        <div class="timer-block">
          <span class="timer-value" id="minutes">00</span>
          <span class="timer-unit">Minutes</span>
        </div>
        <div class="timer-block">
          <span class="timer-value" id="seconds">00</span>
          <span class="timer-unit">Seconds</span>
        </div>
      </div>
    </div>
    
    <div class="status">
      <i class="ti ti-activity"></i>
      <span>Maintenance in Progress</span>
    </div>
    
    <div class="social">
      <div class="social-label">Stay connected with us</div>
      <div class="social-links">
        <a href="https://t.me/KolonoEX" class="social-link" target="_blank">
          <i class="ti ti-brand-telegram"></i>
          <span>Telegram</span>
        </a>
        <a href="https://x.com/KolonoEX" class="social-link" target="_blank">
          <i class="ti ti-brand-x"></i>
          <span>Twitter</span>
        </a>
      </div>
    </div>
  </div>
  
  <script>
    // Check maintenance status and countdown
    async function checkMaintenance() {
      try {
        const res = await fetch('/api/admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'getMaintenanceStatus', public: true })
        });
        const data = await res.json();
        
        if (data.enabled && data.endTime) {
          const endTime = new Date(data.endTime).getTime();
          updateCountdown(endTime);
          document.getElementById('timerWrap').style.display = 'block';
        } else if (!data.enabled) {
          // Maintenance disabled, redirect to main app
          window.location.href = 'index.html';
        }
      } catch (e) {
        console.error('Failed to check maintenance status:', e);
      }
    }
    
    function updateCountdown(endTime) {
      function update() {
        const now = Date.now();
        const diff = endTime - now;
        
        if (diff <= 0) {
          // Maintenance ended, redirect
          window.location.href = 'index.html';
          return;
        }
        
        const hours = Math.floor(diff / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);
        
        document.getElementById('hours').textContent = String(hours).padStart(2, '0');
        document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
        document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
      }
      
      update();
      setInterval(update, 1000);
    }
    
    checkMaintenance();
    // Recheck every 30 seconds
    setInterval(checkMaintenance, 30000);
  </script>
</body>
</html>
